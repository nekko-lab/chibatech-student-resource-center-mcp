# 各リポジトリの .github/workflows/ に置き、PRを Nekko Cloud のProjectへ追加する
# 事前準備:
#   - Projectへの書き込み権限を持つトークン（GitHub App または fine-grained PAT）を
#     Organization secret「PROJECT_TOKEN」として登録する（GITHUB_TOKEN ではOrganizationのProjectを操作できません）
#   - Projectの組み込みワークフローで「Item added to project → Status: In Review」を設定する
name: Add PR to Project

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  add-to-project:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/nekko-lab/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
